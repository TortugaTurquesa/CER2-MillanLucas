{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm p-4">
            <h3 class="text-center mb-3">Iniciar Sesión</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-dark w-100 mt-2">Ingresar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
