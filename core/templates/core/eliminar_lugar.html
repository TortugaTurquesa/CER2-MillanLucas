{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm p-4 text-center">
            <h3 class="text-danger mb-3">¿Eliminar Lugar?</h3>
            <p class="text-muted">¿Estás seguro de que deseas eliminar el registro de <strong>{{ lugar.nombre }}</strong>? Esta acción no se puede deshacer.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 mb-2">Sí, eliminar</button>
                <a href="{% url 'gestion_lugares' %}" class="btn btn-outline-secondary w-100">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
