{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card shadow-sm p-4">
            <h3 class="text-center mb-3">Crear Cuenta</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-dark w-100 mt-2">Registrarse</button>
            </form>
            <p class="text-center mt-3 small">¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="text-dark fw-bold">Inicia sesión</a></p>
        </div>
    </div>
</div>
{% endblock %}
