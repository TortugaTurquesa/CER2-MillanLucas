{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'catalogo' %}" class="text-decoration-none text-dark">Catálogo</a></li>
                <li class="breadcrumb-item active" aria-current="page">{{ lugar.nombre }}</li>
            </ol>
        </nav>
        <div class="card shadow-sm">
            <img src="{{ lugar.imagen }}" class="card-img-top" alt="{{ lugar.nombre }}" style="max-height: 400px; object-fit: cover;">
            <div class="card-body p-4">
                <span class="badge bg-primary mb-2">{{ lugar.categoria.nombre }}</span>
                <h1 class="card-title fw-bold">{{ lugar.nombre }}</h1>
                <p class="text-muted mb-3"><strong>Ubicación:</strong> {{ lugar.ubicacion }} | <strong>Año de construcción:</strong> {{ lugar.anio_construccion }}</p>
                <hr>
                <p class="card-text" style="white-space: pre-line;">{{ lugar.descripcion }}</p>
                <a href="{% url 'catalogo' %}" class="btn btn-outline-dark mt-3">Volver al catálogo</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
